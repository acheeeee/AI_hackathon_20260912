name: ${COMPOSE_PROJECT_NAME:-ai-hackathon-demo}

x-backend-service: &backend-service
  image: ${BACKEND_IMAGE:-ai-hackathon-backend:dev}
  platform: ${DOCKER_PLATFORM:-linux/amd64}
  build:
    context: ..
    dockerfile: deployment/docker/backend.Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  caseapi:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - caseapi.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8001'
      - --workers
      - '1'
      - --no-access-log
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      CASEAPI_ACTOR_ID: ${CASEAPI_ACTOR_ID:-actor_demo}
      CASEAPI_DB_PATH: /var/lib/caseapi/caseapi.db
      CASEAPI_EVIDENCE_RELEASE_DIR: /app/data/processed/releases/r3
      CASEAPI_EVIDENCE_RELEASE_ID: r3
      CASEAPI_MODEL_PROVIDER: ${CASEAPI_MODEL_PROVIDER:-fixed}
      CASEAPI_AGENTCORE_RUNTIME_ARN: ${CASEAPI_AGENTCORE_RUNTIME_ARN:-}
      CASEAPI_AGENTCORE_REGION: ${CASEAPI_AGENTCORE_REGION:-us-west-2}
    volumes:
      - caseapi-data:/var/lib/caseapi
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/api/v1/openapi.json', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  legacy-api:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --workers
      - '1'
      - --no-access-log
    environment:
      CORS_ORIGINS: http://localhost
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${FRONTEND_IMAGE:-ai-hackathon-frontend:dev}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: deployment/docker/frontend.Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      caseapi:
        condition: service_healthy
      legacy-api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-80}:8080'
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  app:
    driver: bridge

volumes:
  caseapi-data:
    name: ${COMPOSE_PROJECT_NAME:-ai-hackathon-demo}-caseapi-data
