<svg width="200" height="84" viewBox="0 0 200 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BEDO logo">
  <!-- 外圈藍色圓角矩形底 -->
  <rect x="2" y="2" width="196" height="80" rx="12" fill="#0b3d91"/>
  <!-- 內部黃色橢圓 -->
  <ellipse cx="100" cy="42" rx="86" ry="30" fill="#ffd400"/>
  <!-- BEDO 粗體無襯線字 -->
  <text x="100" y="42" text-anchor="middle" dominant-baseline="central"
        font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900"
        font-size="34" fill="#0b3d91" letter-spacing="1">BEDO</text>
</svg>
