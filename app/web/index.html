<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新北市政府訴願管理 AI 輔助系統</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 頁首 -->
  <header class="topbar">
    <div class="brand">
      <img src="/static/bedo-logo.svg" alt="BEDO" class="logo">
      <div class="brand-text">
        <h1>新北市政府訴願管理 AI 輔助系統</h1>
        <p>Appeals Management AI Assistant　·　法規推薦｜時效提示｜相似案例｜草稿生成</p>
      </div>
    </div>
    <div id="apiStatus" class="api-status">連線檢查中…</div>
  </header>

  <main class="layout">
    <!-- 左欄：進件 -->
    <section class="panel intake">
      <h2 class="panel-title">📥 進件</h2>

      <div class="field">
        <label class="field-label">進件方式</label>
        <div class="segmented">
          <label><input type="radio" name="mode" value="pdf" checked> 上傳 PDF</label>
          <label><input type="radio" name="mode" value="manual"> 手動輸入</label>
        </div>
      </div>

      <!-- PDF 上傳區 -->
      <div id="pdfArea" class="mode-area">
        <label class="dropzone" id="dropzone">
          <input type="file" id="pdfInput" accept="application/pdf" hidden>
          <span class="dz-icon">📄</span>
          <span class="dz-text">點擊或拖曳訴願書 PDF 至此</span>
          <span class="dz-file" id="pdfName"></span>
        </label>
      </div>

      <!-- 手動輸入區 -->
      <div id="manualArea" class="mode-area hidden">
        <div class="field"><label>案件類型</label><input type="text" id="m_case_type" placeholder="如：違反廢棄物清理法事件"></div>
        <div class="grid2">
          <div class="field"><label>訴願人</label><input type="text" id="m_appellant" placeholder="如：王○○"></div>
          <div class="field"><label>原處分機關</label><input type="text" id="m_authority" placeholder="如：新北市政府環境保護局"></div>
        </div>
        <div class="field"><label>原處分書文號</label><input type="text" id="m_dispno" placeholder="如：新北環稽字第○○號"></div>
        <div class="grid2">
          <div class="field"><label>行為時（民國年）</label><input type="number" id="m_behavior" placeholder="113"></div>
          <div class="field"><label>處分時（民國年）</label><input type="number" id="m_disposition" placeholder="113"></div>
        </div>
        <div class="field"><label>違規事實摘要</label><textarea id="m_facts" rows="3" placeholder="描述違規情節…"></textarea></div>
        <div class="field"><label>訴願人主張／爭點</label><textarea id="m_claims" rows="3" placeholder="訴願人的主張…"></textarea></div>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="useLlm"> 使用 AI 生成（爭點擷取／決定書草稿，耗用 API 額度）
      </label>

      <button id="analyzeBtn" class="btn-primary">🚀 開始分析</button>
      <p class="hint">分析採本地檢索為主，AI 生成為輔；法條均來自知識庫原文。</p>
    </section>

    <!-- 右欄：結果 -->
    <section class="panel results">
      <div id="placeholder" class="placeholder">
        <div class="ph-icon">⚖️</div>
        <p>請於左側進件後按「開始分析」，結果將顯示於此。</p>
      </div>

      <div id="resultArea" class="hidden">
        <!-- ① 分類與擷取 -->
        <div class="result-block">
          <h3>①　案件分類與資訊擷取</h3>
          <div id="blockClassify"></div>
        </div>
        <!-- ② 法規 + 時效 -->
        <div class="result-block">
          <h3>②　適用法規與時效提示</h3>
          <div id="blockStatutes"></div>
        </div>
        <!-- ③ 相似案例 -->
        <div class="result-block">
          <h3>③　歷史相似前例（前 5 名，以法條為主）</h3>
          <div id="blockSimilar"></div>
        </div>
        <!-- ④ 草稿 -->
        <div class="result-block">
          <h3>④　決定書草稿</h3>
          <div class="draft-actions">
            <button id="draftBtn" class="btn-secondary">📝 生成草稿</button>
            <button id="docxBtn" class="btn-secondary" disabled>⬇️ 匯出 Word</button>
          </div>
          <div id="blockDraft"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loadingText">分析中…</span></div>

  <script src="/static/app.js"></script>
</body>
</html>
